<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <style>
        body { 
            background: #05070a; color: white; font-family: sans-serif;
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }
        .login-card {
            background: rgba(255,255,255,0.05); padding: 40px;
            border-radius: 20px; border: 1px solid rgba(212, 175, 55, 0.3);
            text-align: center; width: 350px;
        }
        input {
            width: 100%; padding: 12px; margin: 10px 0;
            background: #111; border: 1px solid #333; color: white; border-radius: 8px;
        }
        button {
            width: 100%; padding: 12px; background: #d4af37;
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
        }
        .error { color: #e74c3c; font-size: 0.9rem; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 style="color: #d4af37;">Admin Portal</h2>
        {% with messages = get_flashed_messages() %}
          {% if messages %}<p class="error">{{ messages[0] }}</p>{% endif %}
        {% endwith %}
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Access Admin Panel</button>
        </form>
    </div>
</body>
</html>
